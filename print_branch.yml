---
- name: Demonstrate SCM branch variables
  hosts: localhost
  gather_facts: false

  tasks:
    - name: Print tower_project_scm_branch
      debug:
        msg: "tower_project_scm_branch = {{ tower_project_scm_branch | default('UNDEFINED') }}"

    - name: Print all SCM-related variables
      debug:
        var: ansible_env
